spring.application.name=gestaoDocumentos

# Configurações do banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://192.168.25.103:5432/icmbio
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://192.168.25.103:5432/icmbio
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=true
spring.flyway.table=flyway_history_icmbio

# Configurações do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev.icmbio.youxgroup.com.br/keycloak/realms/icmbio
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev.icmbio.youxgroup.com.br/keycloak/realms/icmbio/protocol/openid-connect/certs

# Validação de Audience (Client ID do frontend que acessa este backend)
# Apenas tokens emitidos para este client serão aceitos
spring.security.oauth2.resourceserver.jwt.audiences=gestao-documentos

# Logging do Spring Security (opcional, útil para debug)
logging.level.org.springframework.security=DEBUG

keycloak.server-url=https://dev.icmbio.youxgroup.com.br/keycloak
keycloak.admin-realm=master
keycloak.realm=icmbio
keycloak.admin-username=admin
keycloak.admin-password=youx9876
keycloak.admin-client-id=admin-cli

server.port=8086
server.servlet.context-path=/gestao_documentos
